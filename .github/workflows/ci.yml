name: Continuous Integration (DevJobs CI)

# Se ejecuta en cada push a la rama main o en pull requests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # TRABAJO 1: PROBAR Y VALIDAR EL BACKEND
  # ==========================================
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias del Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ejecutar pruebas automatizadas con Pytest
        working-directory: ./backend
        run: |
          pytest -v

  # ==========================================
  # TRABAJO 2: PROBAR Y CONSTRUIR EL FRONTEND
  # ==========================================
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias de React
        working-directory: ./frontend
        run: npm ci

      - name: Compilar Frontend para Producción (Vite Build)
        working-directory: ./frontend
        run: npm run build